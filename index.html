<!Doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Documento</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
 <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
 
	
	<!-- ══ COMPONENTES — ANTES DE <a-scene> ══ -->
  <script>
    var JOY_R     = 37;
    var SPEED     = 0.250;
    var joyActive = false;
    var joyDx = 0, joyDy = 0;
	  
	    var vertDir = 0; /* -1 bajar, 0 quieto, +1 subir */

     AFRAME.registerComponent('mobile-movement', {
      tick: function () {
        var nx = joyDx / JOY_R;
        var ny = joyDy / JOY_R;
        var moving = joyActive && (Math.abs(nx) > 0.05 || Math.abs(ny) > 0.05);

        var camEl = this.el.querySelector('[camera]');
        if (!camEl) return;

        if (moving) {
          var euler = new THREE.Euler();
          euler.setFromQuaternion(
            camEl.object3D.getWorldQuaternion(new THREE.Quaternion()), 'YXZ'
          );
          var angle = euler.y;
          var sinA  = Math.sin(angle);
          var cosA  = Math.cos(angle);
          var pos = this.el.object3D.position;
          pos.x += sinA * (-ny) * SPEED;
          pos.z += cosA * (-ny) * SPEED;
          pos.x += cosA * nx * SPEED;
          pos.z += (-sinA) * nx * SPEED;
        }

        if (vertDir !== 0) {
          camEl.object3D.position.y += vertDir * SPEED;
        }
      }
    });
  </script>

  <style>
	  
	     /* Botones subir/bajar */
    #vert-btns {
      position: fixed; bottom: 28px; right: 108px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 9999;
    }
    .vert-btn {
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.5);
      color: #fff; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation; user-select: none; cursor: pointer;
    }
    .vert-btn:active { background: rgba(255,255,255,0.35); }
	  
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; }

    #joy-zone {
      position: fixed; bottom: 28px; left: 20px;
      width: 120px; height: 120px;
      z-index: 9999; touch-action: none;
    }
    .joy-base {
      width: 120px; height: 120px; border-radius: 50%;
      background: rgba(255,255,255,0.13);
      border: 2px solid rgba(255,255,255,0.4);
      position: relative;
    }
    .joy-thumb {
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,0.55);
      border: 2px solid rgba(255,255,255,0.9);
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none;
    }

    #btn-portal {
      position: fixed; bottom: 28px; right: 20px;
      width: 76px; height: 76px; border-radius: 50%;
      background: rgba(240,230,140,0.25);
      border: 2px solid rgba(240,230,140,0.9);
      color: #fff; font-family: sans-serif;
      font-size: 11px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      text-align: center; line-height: 1.3;
      z-index: 9999; touch-action: manipulation; user-select: none;
    }
    #btn-portal:active { background: rgba(240,230,140,0.55); }

    #crosshair {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none; z-index: 9998;
    }

    #toast {
      position: fixed; bottom: 160px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65); color: #fff;
      font-family: sans-serif; font-size: 14px;
      padding: 8px 18px; border-radius: 20px;
      z-index: 9999; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
	
	  <!-- BOTONES SUBIR / BAJAR -->
  <div id="vert-btns">
    <div class="vert-btn" id="btn-up">▲</div>
    <div class="vert-btn" id="btn-down">▼</div>
  </div>

  <!-- JOYSTICK -->
  <div id="joy-zone">
    <div class="joy-base" id="joy-base">
      <div class="joy-thumb" id="joy-thumb"></div>
    </div>
  </div>

  <!-- BOTÓN PORTAL -->
  <div id="btn-portal">ENTRAR<br>PORTAL</div>

  <!-- CROSSHAIR -->
  <div id="crosshair">
    <svg width="34" height="34" viewBox="0 0 34 34">
      <circle cx="17" cy="17" r="13" fill="none" stroke="white" stroke-width="1.5" opacity="0.75"/>
      <line x1="17" y1="4"  x2="17" y2="11" stroke="white" stroke-width="1.5" opacity="0.75"/>
      <line x1="17" y1="23" x2="17" y2="30" stroke="white" stroke-width="1.5" opacity="0.75"/>
      <line x1="4"  y1="17" x2="11" y2="17" stroke="white" stroke-width="1.5" opacity="0.75"/>
      <line x1="23" y1="17" x2="30" y2="17" stroke="white" stroke-width="1.5" opacity="0.75"/>
      <circle cx="17" cy="17" r="2" fill="white" opacity="0.9"/>
    </svg>
  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <!-- MÚSICA DEL CILINDRO — audio HTML5 en streaming (no decodeAudioData),
       se activa/desactiva junto con el cambio de color rojo/verde. -->
  <audio id="bgm-cilindro" src="kavinsky.mp3" loop preload="auto"></audio>

  <!-- ══════════ ESCENA A-FRAME ══════════ -->
  <a-scene vr-mode-ui="enabled: true"
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.7/">

    <a-assets>
      <a-sound id="Rotativo" src="rotativo.mp3"></a-sound>
      <a-sound id="Camion1"  src="camion.mp3"></a-sound>
    </a-assets>

    <a-gltf-model id="Mazda"      src="low_poly_mazda_mx-5_miata_na_update_opt.glb" rotation="0 -90 0" position="-5 0 2"     scale="1 1 1" sound="src: #Rotativo; on: mouseenter"></a-gltf-model>
    <a-gltf-model id="Gasolinera" src="retro-futuristic_gas_station_opt.glb"         position="0 0 0"   scale="1 1 1"></a-gltf-model>
    <a-gltf-model id="Camion"     src="truck_opt.glb"                                rotation="0 -20 0" position="-29 2.3 20" scale="1 1 1" sound="src: #Camion1; on: mouseenter"></a-gltf-model>
    <a-gltf-model id="Sol1"       src="Sol_opt.glb"                                  position="-120 200 160" scale="0.5 0.5 0.5"></a-gltf-model>
    <a-gltf-model id="Cielo"      src="cielo_opt.glb"                                position="0 0 0"   scale="300 300 300"></a-gltf-model>

    <a-cylinder id="botonMusica" color="red" position="0 1 4.34" scale="0.2 0.2 0.2"
      event-set__enter="_event: mouseenter; color: green"
      event-set__leave="_event: mouseleave; color: red">
    </a-cylinder>

    <a-light id="Sol2"       type="point"   color="#FFFFFF" position="-120 200 160" intensity="1000"></a-light>
    <a-light id="ambiente"   type="ambient" color="#FFFFFF" intensity="1"></a-light>
    <a-light id="Gasolinera1" type="point"  color="#F0E68C" position="14.6 7.3 14.4"  intensity="30"></a-light>
    <a-light id="Gasolinera2" type="point"  color="#F0E68C" position="14.6 7.3 2.5"   intensity="30"></a-light>
    <a-light id="Gasolinera3" type="point"  color="#F0E68C" position="14.6 7.3 26.6"  intensity="30"></a-light>
    <a-light id="Gasolinera4" type="point"  color="#F0E68C" position="-0.3 7.3 14.4"  intensity="30"></a-light>
    <a-light id="Gasolinera5" type="point"  color="#F0E68C" position="-0.3 7.3 2.5"   intensity="30"></a-light>
    <a-light id="Gasolinera6" type="point"  color="#F0E68C" position="-0.3 7.3 26.6"  intensity="30"></a-light>

    <a-box position="-27 0 20" scale="1 1 1" color="red" rotation="0 -20 0"
      event-set__enter="_event: mouseenter; _target: #cartel; visible: true"
      event-set__leave="_event: mouseleave; _target: #cartel; visible: false">
      <a-box id="cartel" src="image-12-768x432-1.png" color="#FFFFFF" visible="false" position="1 3 0" scale="0 4 8"></a-box>
    </a-box>

    <!-- PORTAL -->
    <a-link id="miEnlace1"
      href="https://carlatienzam-byte.github.io/EPE-IES-Carmen-de-Burgos-Segui/"
      title="Backrooms"
	  image="backrooms.jpg"	
      position="19.26834 1.027 13.99184"
      scale="0.5 0.5 0.5"
      geometry="primitive: circle; segments: 64"
      material="shader: portal; side: double; previewDistance: 7.5"
      rotation="0 90 0"
      class="portal"
      data-url="https://carlatienzam-byte.github.io/EPE-IES-Carmen-de-Burgos-Segui/">
      <a-entity text="align: center; color: white; font: kelsonsans; value: Backrooms; width: 5"
                position="0 1.5 0" rotation="0 180 0"></a-entity>
    </a-link>

    <!-- CÁMARA -->
    <a-entity id="rig" position="0 0 0" mobile-movement>
      <a-camera id="camera"
        position="0 1.6 0"
        camera="userHeight: 0"
        look-controls="touchEnabled: true; magicWindowTrackingEnabled: false; pointerLockEnabled: false; reverseTouchDrag: true"
        wasd-controls="enabled: false">
        <a-cursor color="#fff" fuse="false"></a-cursor>
      </a-camera>
    </a-entity>

  </a-scene>

  <script>
	  
	     /* ── BOTONES SUBIR / BAJAR ── */
    ['up','down'].forEach(function(dir) {
      var btn = document.getElementById('btn-' + dir);
      var val = dir === 'up' ? 1 : -1;
      btn.addEventListener('touchstart', function(e) { e.preventDefault(); vertDir = val; }, { passive: false });
      btn.addEventListener('touchend',   function(e) { e.preventDefault(); vertDir = 0;   }, { passive: false });
      btn.addEventListener('mousedown',  function()  { vertDir = val; });
      btn.addEventListener('mouseup',    function()  { vertDir = 0; });
    });
	  
    /* ── JOYSTICK ── */
    var joyBase  = document.getElementById('joy-base');
    var joyThumb = document.getElementById('joy-thumb');

    function joyPos(touch) {
      var r = joyBase.getBoundingClientRect();
      return {
        x: touch.clientX - r.left - r.width  / 2,
        y: touch.clientY - r.top  - r.height / 2
      };
    }

    joyBase.addEventListener('touchstart', function(e) {
      e.preventDefault(); joyActive = true;
    }, { passive: false });

    joyBase.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (!joyActive) return;
      var p = joyPos(e.touches[0]);
      var d = Math.sqrt(p.x*p.x + p.y*p.y);
      var c = d > JOY_R ? JOY_R / d : 1;
      joyDx =  p.x * c;
      joyDy = -p.y * c;
      joyThumb.style.transform =
        'translate(calc(-50% + '+joyDx+'px), calc(-50% + '+(-joyDy)+'px))';
    }, { passive: false });

    joyBase.addEventListener('touchend', function(e) {
      e.preventDefault();
      joyActive = false; joyDx = 0; joyDy = 0;
      joyThumb.style.transform = 'translate(-50%,-50%)';
    }, { passive: false });

    /* ── TOAST ── */
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._tid);
      t._tid = setTimeout(function(){ t.classList.remove('show'); }, 2500);
    }

    /* ── PORTAL por raycaster central ── */
    function getPortalAtCenter() {
      var camEl = document.getElementById('camera');
      if (!camEl) return null;
      var cam = camEl.getObject3D('camera');
      if (!cam) return null;
      var rc = new THREE.Raycaster();
      rc.setFromCamera(new THREE.Vector2(0,0), cam);
      var meshes = [];
      document.querySelectorAll('.portal').forEach(function(el) {
        el.object3D.traverse(function(o){ if (o.isMesh) meshes.push(o); });
      });
      var hits = rc.intersectObjects(meshes, true);
      if (!hits.length) return null;
      var obj = hits[0].object;
      for (var i = 0; i < 8; i++) {
        if (obj.el && obj.el.dataset && obj.el.dataset.url) return obj.el;
        if (!obj.parent) break;
        obj = obj.parent;
      }
      return null;
    }

    function activatePortal(el) {
      if (!el) { showToast('Apunta a un portal'); return; }
      showToast('Entrando: ' + (el.getAttribute('title') || 'Portal'));
      setTimeout(function(){ window.location.href = el.dataset.url; }, 600);
    }

    /* ── BOTÓN PORTAL ── */
    var btnPortal = document.getElementById('btn-portal');
    btnPortal.addEventListener('touchstart', function(e) {
      e.preventDefault(); activatePortal(getPortalAtCenter());
    }, { passive: false });
    btnPortal.addEventListener('click', function() {
      activatePortal(getPortalAtCenter());
    });

    /* ── MÚSICA DEL CILINDRO ──
       Se activa la primera vez que se apunta al cilindro (se pone verde) y
       sigue sonando en bucle indefinidamente, aunque deje de estar activo.
       No afecta al volumen de los demás sonidos (surtidor/camión). */
    var cilindroMusica = document.getElementById('botonMusica');
    var bgmCilindro = document.getElementById('bgm-cilindro');
    if (cilindroMusica && bgmCilindro) {
      cilindroMusica.addEventListener('mouseenter', function () {
        if (!bgmCilindro.paused) return; // ya está sonando, no reiniciar
        var playPromise = bgmCilindro.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function (e) {
            console.warn('No se pudo iniciar la música del cilindro:', e);
            showToast('Audio bloqueado: ' + (e && e.name ? e.name : 'toca la pantalla primero'));
          });
        }
      });
      bgmCilindro.addEventListener('error', function () {
        var err = bgmCilindro.error;
        showToast(err ? ('Error audio (código ' + err.code + ')') : 'Error audio desconocido');
        console.error('Audio error:', err);
      });
    }

    /* ── CLICK EN PORTALES: BLOQUEADO A PROPÓSITO ──
       Solo se puede entrar a un portal pulsando el botón "ENTRAR PORTAL".
       Interceptamos el clic en fase de captura (antes de que el componente
       'link' interno de A-Frame procese su navegación automática) y lo
       detenemos por completo. */
    document.querySelectorAll('.portal').forEach(function(el) {
      el.addEventListener('click', function(e) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }, true);
    });

    /* ── DESBLOQUEO DE AUDIO EN MÓVIL ── */
    var audioUnlocked = false;
    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      var ctx = THREE.AudioContext ? THREE.AudioContext.getContext() : null;
      if (ctx && ctx.state === 'suspended') ctx.resume();
    }
    document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
    document.addEventListener('click',      unlockAudio, { once: true });
  </script>

</body>
</html>
